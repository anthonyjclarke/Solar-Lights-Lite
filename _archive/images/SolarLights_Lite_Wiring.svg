<svg viewBox="0 0 1220 760" role="img" aria-label="SolarLights Lite wiring: panel through two series diodes into the TP4056 module; cells on B+/B−; OUT+ and OUT− form the battery and ground rails that feed the Arduino Pro Mini, the MOSFET LED driver and the Wemos D1 Mini." xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .mod{fill:#E9E4DA;stroke:#D3CCBF;stroke-width:1.2}
  .ext{fill:#FCFBF8;stroke:#1E1B16;stroke-width:1.3;stroke-dasharray:5 4}
  .chip{fill:#FCFBF8;stroke:#D3CCBF}
  .chipd{fill:#FCFBF8;stroke:#645E53;stroke-dasharray:4 3}
  text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1E1B16}
