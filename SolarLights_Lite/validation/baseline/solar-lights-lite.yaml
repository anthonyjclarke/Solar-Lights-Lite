# SolarLights Lite – Wemos D1 Mini telemetry (reports only; Pro Mini runs the lights)
# Wake hourly -> connect -> publish -> deep sleep.
#
# Wiring
#   5V  <- TP4056 OUT+ (battery)            G  <- TP4056 OUT−
#   D0  -> RST  (required for deep-sleep wake)
#   A0  <- 220k from OUT+ (plus on-board 220k/100k divider; calibrate multiply)
#   D5  <- Pro Mini D8 LIGHTS_ON via 100k, 220k D5->GND
#   D6  <- TP4056 CHRG pin via Schottky (anode at D6, cathode at CHRG)
#
# HA helper: Toggle "Solar Lights OTA" (input_boolean.solar_lights_ota) – ON keeps it awake for OTA.

substitutions:
  name: solar-lights-lite
  friendly: Solar Lights

esphome:
  name: ${name}
  friendly_name: ${friendly}
  min_version: 2024.11.0

esp8266:
  board: d1_mini

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  # manual_ip:            # recommended – shortens each wake
  #   static_ip: 192.168.1.62
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1

api:
  encryption:
    key: !secret esphome_encryption_key
  on_client_connected:
    - script.execute: publish_and_sleep

ota:
  - platform: esphome

deep_sleep:
  id: deep_sleep_ctl
  run_duration: 45s        # failsafe if HA never connects
  sleep_duration: 60min

script:
  - id: publish_and_sleep
    mode: single
    then:
      - delay: 2s
      - component.update: battery_voltage
      - component.update: wifi_signal_db
      - delay: 2s
      - if:
          condition:
            binary_sensor.is_on: ota_mode
          then:
            - deep_sleep.prevent: deep_sleep_ctl
          else:
            - deep_sleep.enter: deep_sleep_ctl

binary_sensor:
  - platform: homeassistant
    id: ota_mode
    entity_id: input_boolean.solar_lights_ota
    internal: true
  - platform: gpio
    name: "Lights On"
    pin:
      number: D5
    device_class: light
  - platform: gpio
    name: "Charging"
    pin:
      number: D6
      inverted: true
      mode:
        input: true
        pullup: true       # only active while awake
    device_class: battery_charging

sensor:
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    pin: A0
    update_interval: never
    samples: 16
    accuracy_decimals: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 5.21     # your v1 calibration; re-check with a multimeter
  - platform: copy
    source_id: battery_voltage
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          const float v[] = {3.30, 3.50, 3.60, 3.70, 3.80, 3.90, 4.00, 4.10, 4.20};
          const float p[] = {   0,    5,   15,   40,   60,   75,   85,   95,  100};
          if (x <= v[0]) return 0.0f;
          for (int i = 1; i < 9; i++)
            if (x <= v[i]) return p[i-1] + (x - v[i-1]) * (p[i] - p[i-1]) / (v[i] - v[i-1]);
          return 100.0f;
  - platform: wifi_signal
    id: wifi_signal_db
    name: "WiFi Signal"
    update_interval: never
    entity_category: diagnostic
