; Solar Lights Lite controller: ATmega328P Pro Mini-class board, internal 8 MHz.
; The board has no bootloader. `pio run` builds; flashing is done over ISP with
; a separately installed, current avrdude (docs/08-firmware.md). Do not use
; `pio run -t upload`: PlatformIO's bundled avrdude is not the supported uploader.
;
; One environment per telemetry tier (docs/09-home-assistant.md):
;   standalone  – no telemetry output
;   production  – compact status line for the hourly D1 Mini profile
;   advanced    – full diagnostics for the always-on D1 Mini profile

[env]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
monitor_speed = 9600

[env:standalone]
build_flags = -DTELEMETRY=0

[env:production]
build_flags = -DTELEMETRY=1

[env:advanced]
build_flags = -DTELEMETRY=2
