; SolarLights Lite - BTE13-010A / ATmega328P / confirmed internal 8 MHz.
; The target has no bootloader. UART is monitoring-only; application uploads use ISP.
; Canonical procedure: PROGRAMMING.md in this folder.

[platformio]
default_envs = pro8_usbasp

[env]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino

; Preferred production upload. The explicit command uses the system avrdude on PATH.
[env:pro8_usbasp]
upload_protocol = custom
upload_command = avrdude -c usbasp -p atmega328p -v -U flash:w:$SOURCE:i

; Preferred bench build: identical control logic plus rate-limited diagnostics at 9600.
[env:pro8_usbasp_debug]
extends = env:pro8_usbasp
build_flags = -DDEBUG_SERIAL=1
monitor_speed = 9600

; Fallback for an Arduino running the standard ArduinoISP sketch.
; Always pass the current programmer port with --upload-port; never hardcode it here.
[env:pro8_arduinoisp]
upload_protocol = custom
upload_speed = 19200
upload_command = avrdude -c stk500v1 -P $UPLOAD_PORT -b $UPLOAD_SPEED -p atmega328p -v -U flash:w:$SOURCE:i

[env:pro8_arduinoisp_debug]
extends = env:pro8_arduinoisp
build_flags = -DDEBUG_SERIAL=1
monitor_speed = 9600
