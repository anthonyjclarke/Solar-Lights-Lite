# REV 0.4 REVIEW PROPOSAL: see docs/BUILD_GUIDE.md before wiring.
# Supply via qualified 3.3 V converter into 3V3, with onboard LDO isolated.
# D5 now uses an NPN inverter; D6/CHRG and raw panel sense are NOT CONNECTED.
# ADC multiplier still needs calibration; 5.4 is nominal with 220k + 220k / 100k.
# D0 -> RST; A0 <- protected battery via 220k (verify onboard divider).
# D5 <- NPN collector; emitter -> OUT-; base <- Pro Mini D8 via 47k.
# 100k base-emitter; 10k collector to ESP 3V3. D6 left unconnected.
# OTA helper: input_boolean.solar_lights_ota. Turn OFF to resume sleep.

substitutions:
  name: solar-lights-lite
  friendly: Solar Lights

esphome:
  name: ${name}
  friendly_name: ${friendly}
  min_version: 2024.11.0

esp8266:
  board: d1_mini

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  # manual_ip:            # recommended – shortens each wake
  #   static_ip: 192.168.1.62
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1

api:
  encryption:
    key: !secret esphome_encryption_key
  on_client_connected:
    - script.execute: publish_and_sleep

ota:
  - platform: esphome

deep_sleep:
  id: deep_sleep_ctl
  run_duration: 45s        # failsafe if HA never connects
  sleep_duration: 60min

script:
  - id: publish_and_sleep
    mode: single
    then:
      - wait_until:
          condition:
            lambda: 'return id(ota_mode).has_state();'
          timeout: 15s
      - component.update: battery_voltage
      - component.update: wifi_signal_db
      - delay: 2s
      - if:
          condition:
            binary_sensor.is_on: ota_mode
          then:
            - deep_sleep.prevent: deep_sleep_ctl
          else:
            - deep_sleep.enter: deep_sleep_ctl

binary_sensor:
  - platform: homeassistant
    id: ota_mode
    entity_id: input_boolean.solar_lights_ota
    internal: true
    on_press:
      - deep_sleep.prevent: deep_sleep_ctl
    on_release:
      - deep_sleep.allow: deep_sleep_ctl
      - script.execute: publish_and_sleep
  - platform: gpio
    name: "Lights On"
    pin:
      number: D5
      inverted: true
      mode:
        input: true
        pullup: true
    device_class: light

sensor:
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    pin: A0
    update_interval: never
    samples: 16
    accuracy_decimals: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 5.21     # your v1 calibration; re-check with a multimeter
  - platform: copy
    source_id: battery_voltage
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          const float v[] = {3.30, 3.50, 3.60, 3.70, 3.80, 3.90, 4.00, 4.10, 4.20};
          const float p[] = {   0,    5,   15,   40,   60,   75,   85,   95,  100};
          if (x <= v[0]) return 0.0f;
          for (int i = 1; i < 9; i++)
            if (x <= v[i]) return p[i-1] + (x - v[i-1]) * (p[i] - p[i-1]) / (v[i] - v[i-1]);
          return 100.0f;
  - platform: wifi_signal
    id: wifi_signal_db
    name: "WiFi Signal"
    update_interval: never
    entity_category: diagnostic
