# Solar Lights Lite – Tier 2: Production Telemetry (hourly deep-sleep Wemos D1 Mini)
#
# The low-power profile for the finished, battery-only installation. Once an
# hour the D1 Mini wakes, listens for one status line from the controller's
# `production` firmware build (sent every ~8 s), reads the battery voltage,
# reports to Home Assistant and returns to deep sleep. The lights never depend
# on it: the controller runs autonomously.
#
# Wiring is the same harness as Tier 1 (controller D1/TX -> R8/Q2/R9/R10 ->
# D1 Mini D6, VBAT_SYS -> R5 220k -> A0, G to OUT-), plus:
#   - power: U3 (TPS63802, set to 3.3 V, VIN on VBAT_SYS) OUT -> D1 Mini 3V3.
#     Micro-USB and the 5V pin are NOT connected. Never connect both supplies.
#   - deep-sleep wake: D1 Mini D0 -> RST.
#
# OTA / maintenance: turn ON input_boolean.solar_lights_ota in Home Assistant
# (created by homeassistant/solar_lights_package.yaml) and wait for the next
# wake; the D1 Mini then stays awake for updates. Turn it OFF to resume sleep.
#
# Keep the device name, entity names and encryption key identical to the Tier 1
# profile so Home Assistant history carries over. The UART parsing below is a
# subset of the Tier 1 profile; keep the two in step.
#
# Required secrets: wifi_ssid, wifi_password, esphome_encryption_key,
# ota_password. See docs/09-home-assistant.md.

substitutions:
  name: solar-lights
  friendly: Solar Lights

esphome:
  name: ${name}
  friendly_name: ${friendly}
  min_version: 2024.11.0

esp8266:
  board: d1_mini

logger:
  level: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  # A static address shortens every wake. Adjust to your network:
  # manual_ip:
  #   static_ip: 192.168.1.62
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1

api:
  encryption:
    key: !secret esphome_encryption_key
  on_client_connected:
    - script.execute: publish_and_sleep

ota:
  - platform: esphome
    password: !secret ota_password

deep_sleep:
  id: deep_sleep_ctl
  run_duration: 60s        # failsafe if Home Assistant never connects
  sleep_duration: 60min

globals:
  - id: last_arduino_report_ms
    type: uint32_t
    restore_value: no      # cleared on every wake: "a line arrived this wake"
    initial_value: '0'

script:
  - id: publish_and_sleep
    mode: single
    then:
      - wait_until:
          condition:
            lambda: 'return id(ota_mode).has_state();'
          timeout: 15s
      - wait_until:
          condition:
            lambda: 'return id(last_arduino_report_ms) != 0;'
          timeout: 20s
      - component.update: battery_voltage
      - component.update: wifi_signal_db
      - delay: 2s
      - if:
          condition:
            binary_sensor.is_on: ota_mode
          then:
            - deep_sleep.prevent: deep_sleep_ctl
          else:
            - deep_sleep.enter: deep_sleep_ctl

uart:
  id: arduino_diagnostics
  rx_pin:
    number: D6
    inverted: true
  baud_rate: 9600
  rx_buffer_size: 256
  debug:
    direction: RX
    dummy_receiver: true
    after:
      bytes: 200           # a production line is ~110 characters
      timeout: 500ms
      delimiter: "\n"
    sequence:
      - lambda: |-
          // Trim control/idle bytes from both ends (the link idles in a break
          // state between lines), then reject anything corrupted.
          std::string line(bytes.begin(), bytes.end());
          auto printable = [](unsigned char c) { return c >= 0x20 && c <= 0x7E; };
          while (!line.empty() && !printable(line.front())) line.erase(0, 1);
          while (!line.empty() && !printable(line.back())) line.pop_back();
          if (line.empty()) return;
          for (unsigned char c : line) {
            if (!printable(c)) {
              ESP_LOGW("arduino", "Dropped corrupted UART line (%u bytes)", (unsigned) line.size());
              return;
            }
          }
          if (line.rfind("fw=", 0) != 0) return;   // partial line caught at wake
          id(last_arduino_report_ms) = millis();
          id(arduino_diagnostic_line).publish_state(line.c_str());

          auto number_of = [&](const char *key, float *result) -> bool {
            const std::string needle = " " + std::string(key) + "=";
            const size_t position = (" " + line).find(needle);
            if (position == std::string::npos) return false;
            const char *start = line.c_str() + position + needle.size() - 1;
            char *end = nullptr;
            const float value = strtof(start, &end);
            if (end == start) return false;
            *result = value;
            return true;
          };
          auto word_of = [&](const char *key) -> std::string {
            const std::string needle = " " + std::string(key) + "=";
            const size_t position = (" " + line).find(needle);
            if (position == std::string::npos) return "";
            const size_t start = position + needle.size() - 1;
            const size_t end = line.find(' ', start);
            return line.substr(start, end == std::string::npos ? std::string::npos : end - start);
          };

          float value = 0.0f;
          if (number_of("time", &value)) id(arduino_scheduler_time_s).publish_state(value);
          if (number_of("vdd", &value)) id(arduino_vdd).publish_state(value);
          if (number_of("ldr", &value)) id(arduino_ldr_percent).publish_state(value);
          if (number_of("output", &value)) id(arduino_light_duty).publish_state(value);

          const std::string fw = word_of("fw");
          const std::string battery = word_of("battery");
          const std::string sense = word_of("sense");
          const std::string mode = word_of("mode");
          const std::string night = word_of("night");
          const std::string cause = word_of("cause");
          if (!fw.empty()) id(arduino_firmware).publish_state(fw.c_str());
          if (!battery.empty()) id(arduino_battery_band).publish_state(battery.c_str());
          if (!sense.empty()) id(arduino_light_sense).publish_state(sense.c_str());
          if (!mode.empty()) id(arduino_mode).publish_state(mode.c_str());
          if (!night.empty()) id(arduino_night).publish_state(night.c_str());
          if (!cause.empty()) id(arduino_output_cause).publish_state(cause.c_str());

text_sensor:
  - platform: template
    id: arduino_diagnostic_line
    name: "Arduino Diagnostic Line"
    entity_category: diagnostic
  - platform: template
    id: arduino_firmware
    name: "Arduino Firmware"
    entity_category: diagnostic
  - platform: template
    id: arduino_battery_band
    name: "Arduino Battery Band"
  - platform: template
    id: arduino_light_sense
    name: "Arduino Light Sense"
  - platform: template
    id: arduino_mode
    name: "Arduino Mode"
  - platform: template
    id: arduino_night
    name: "Arduino Night"
  - platform: template
    id: arduino_output_cause
    name: "Arduino Output Cause"

binary_sensor:
  - platform: homeassistant
    id: ota_mode
    entity_id: input_boolean.solar_lights_ota
    internal: true
    on_press:
      - deep_sleep.prevent: deep_sleep_ctl
    on_release:
      - deep_sleep.allow: deep_sleep_ctl
      - script.execute: publish_and_sleep
  - platform: template
    name: "Arduino Diagnostics Fresh"
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(last_arduino_report_ms) != 0;'
  - platform: template
    name: "Arduino Lights Commanded"
    device_class: light
    lambda: |-
      return !isnan(id(arduino_light_duty).state) && id(arduino_light_duty).state > 0.0f;

sensor:
  # VBAT_SYS -> R5 220k -> A0, plus the D1 Mini's onboard 220k/100k divider.
  # Use the multiplier calibrated in Tier 1 (nominal 5.4).
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    pin: A0
    update_interval: never
    samples: 16
    accuracy_decimals: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 5.21
  - platform: copy
    source_id: battery_voltage
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      # Resting-voltage estimate for a Li-ion cell, not coulomb counting.
      - lambda: |-
          const float v[] = {3.30, 3.50, 3.60, 3.70, 3.80, 3.90, 4.00, 4.10, 4.20};
          const float p[] = {   0,    5,   15,   40,   60,   75,   85,   95,  100};
          if (x <= v[0]) return 0.0f;
          for (int i = 1; i < 9; i++)
            if (x <= v[i]) return p[i-1] + (x - v[i-1]) * (p[i] - p[i-1]) / (v[i] - v[i-1]);
          return 100.0f;
  - platform: template
    id: arduino_scheduler_time_s
    name: "Arduino Scheduler Time"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: arduino_vdd
    name: "Arduino VDD"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
  - platform: template
    id: arduino_ldr_percent
    name: "Arduino LDR"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: arduino_light_duty
    name: "Arduino Light Duty"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
  - platform: wifi_signal
    id: wifi_signal_db
    name: "D1 WiFi Signal"
    update_interval: never
    entity_category: diagnostic
