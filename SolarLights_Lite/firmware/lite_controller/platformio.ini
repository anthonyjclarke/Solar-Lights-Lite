; SolarLights Lite – Arduino Pro Mini 3.3 V 8 MHz
; Rev 0.4: requires physically configured 8 MHz hardware. See ../../docs/BUILD_GUIDE.md.
; Batteries, panel and other modules must be disconnected during programming.
;
; Two upload profiles below:
;   [env:pro8]     serial upload through a bootloader. Only works on a chip
;                  that still has one flashed (BOOTRST=0).
;   [env:pro8_isp] ISP upload via Arduino-as-ISP (stk500v1). Use this for the
;                  BTE13-010A: on 21 Sep 2026 its fuses were set to internal
;                  8 MHz / BOD 2.7 V / NO BOOTLOADER (lfuse 0xE2, hfuse 0xD9,
;                  efuse 0xFD - see docs/VALIDATION.md addendum), so
;                  [env:pro8] can no longer reach it. A first ISP upload does
;                  a normal full chip erase of program memory; it does not
;                  touch the fuses already set.
;
; default_envs below picks pro8_isp when you run plain "pio run -t upload"
; or click a generic Upload button, so the old bootloader profile is never
; hit by accident. VS Code users: also check the environment picker in the
; bottom status bar shows pro8_isp, not pro8, before uploading.
;
; upload_port under [env:pro8_isp] is commented out on purpose: the ISP
; programmer enumerates as a DIFFERENT /dev/cu.usbserial-XXXX on every
; machine (and sometimes every replug). Always pass it explicitly:
;   pio run -e pro8_isp -t upload --upload-port /dev/cu.usbserial-XXXX
; Find the right one with: ls /dev/cu.usbserial-*
; - it is the Arduino running ArduinoISP, not any other serial device
; (a Pro Mini's own CH340/FTDI adapter, if also plugged in, is a
; different port and will show the exact same "not in sync" failure if
; used here by mistake).

[platformio]
default_envs = pro8_isp

[env:pro8]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
upload_speed = 57600
; upload_port = /dev/cu.usbserial-XXXX

[env:pro8_isp]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
upload_protocol = stk500v1
upload_speed = 19200
; upload_port intentionally not set here - pass --upload-port explicitly, see note above.
; Last known good on the MacBook: /dev/cu.usbserial-A98B3PDH (21 Sep 2026). Will differ on the iMac.
;
; upload_command below forces plain "pio run -t upload" to shell out to
; whatever "avrdude" resolves to on PATH (the system install), instead of
; PlatformIO's own bundled tool-avrdude (6.3.0). That bundled version was
; confirmed on 21 Sep 2026 to reliably fail flash verification against this
; exact ArduinoISP/stk500v1 setup (deterministic mismatch at byte 0x0006,
; same byte and same values on repeat attempts, after wiring/cables were
; already ruled out) - the system avrdude (8.3 at the time) wrote and
; verified the identical .hex cleanly, twice. See docs/VALIDATION.md
; addendum. This override is UNTESTED by itself - if "pio run -t upload"
; still fails, fall back to the two-step method also in that addendum:
;   pio run -e pro8_isp
;   avrdude -c stk500v1 -P /dev/cu.usbserial-XXXX -b 19200 -p m328p -v \
;     -U flash:w:.pio/build/pro8_isp/firmware.hex:i
upload_command = avrdude -c stk500v1 -P $UPLOAD_PORT -b $UPLOAD_SPEED -p atmega328p -v -U flash:w:$SOURCE:i
