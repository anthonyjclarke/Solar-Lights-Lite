; SolarLights Lite - BTE13-010A / ATmega328P / confirmed internal 8 MHz.
; The target has no bootloader. UART is monitoring-only; application uploads use ISP.
; Run `pio run` to BUILD only. Do not use `pio -t upload`: it selects PlatformIO's
; bundled avrdude, which is not the supported uploader for this project.
; Use the separately installed current avrdude exactly as PROGRAMMING.md specifies.

[platformio]
default_envs = pro8

[env]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino

[env:pro8]
; Explicitly quiet, irrespective of the source-file default used for ad-hoc builds.
build_flags = -DDEBUG_SERIAL=0

; Bench build: identical controller logic plus rate-limited diagnostics at 9600 baud.
[env:pro8_debug]
extends = env:pro8
build_flags = -DDEBUG_SERIAL=1
monitor_speed = 9600
