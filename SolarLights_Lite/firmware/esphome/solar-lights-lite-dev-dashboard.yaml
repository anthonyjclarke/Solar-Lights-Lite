# Solar Lights Lite v0.5 -- Home Assistant development telemetry dashboard.
#
# Import this file through Home Assistant's dashboard YAML editor after flashing
# solar-lights-lite-dev-d1.yaml. It uses only built-in Lovelace cards. Entity IDs
# assume that file's device name `telemetry` (friendly name `Telemetry`); adjust
# them here if Home Assistant has assigned different entity IDs.
#
# This is a bench dashboard. It shows controller and receiver health, but does
# not measure panel/charge/load current, energy or temperature. Gauges switch to
# a "no data yet" tile while their sensor is unknown or unavailable.

title: Solar Lights — Development Telemetry
views:
  - title: Bench telemetry
    path: solar-lights-development
    icon: mdi:solar-power-variant-outline
    type: sections
    max_columns: 4
    badges:
      - type: entity
        entity: binary_sensor.telemetry_d1_status
        name: D1 online
        show_name: true
        show_state: true
        show_icon: true
      - type: entity
        entity: binary_sensor.telemetry_arduino_diagnostics_fresh
        name: UART data
        show_name: true
        show_state: true
        show_icon: true
      - type: entity
        entity: binary_sensor.telemetry_arduino_lights_commanded
        name: Lights
        show_name: true
        show_state: true
        show_icon: true
      - type: entity
        entity: sensor.telemetry_arduino_mode
        name: Mode
        show_name: true
        show_state: true
        show_icon: true
        icon: mdi:state-machine
      - type: entity
        entity: sensor.telemetry_battery_voltage
        name: Battery
        show_name: true
        show_state: true
        show_icon: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Battery & output
            icon: mdi:battery-charging
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.telemetry_battery_voltage
                state_not:
                  - unknown
                  - unavailable
            card:
              type: gauge
              entity: sensor.telemetry_battery_voltage
              name: Battery rail
              needle: true
              min: 3.2
              max: 4.25
              severity:
                red: 3.2
                yellow: 3.5
                green: 3.7
            grid_options:
              columns: 6
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.telemetry_battery_voltage
                state:
                  - unknown
                  - unavailable
            card:
              type: tile
              entity: sensor.telemetry_battery_voltage
              name: Battery rail (no data yet)
              icon: mdi:help-circle-outline
            grid_options:
              columns: 6
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.telemetry_arduino_light_duty
                state_not:
                  - unknown
                  - unavailable
            card:
              type: gauge
              entity: sensor.telemetry_arduino_light_duty
              name: Light output
              needle: true
              min: 0
              max: 100
              severity:
                green: 1
                yellow: 70
                red: 95
            grid_options:
              columns: 6
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.telemetry_arduino_light_duty
                state:
                  - unknown
                  - unavailable
            card:
              type: tile
              entity: sensor.telemetry_arduino_light_duty
              name: Light output (no data yet)
              icon: mdi:help-circle-outline
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_battery_level
            name: Battery estimate
            icon: mdi:battery
            vertical: false
            grid_options:
              columns: 6
            color: green
          - type: tile
            entity: sensor.telemetry_arduino_vdd
            name: Arduino VDD
            icon: mdi:memory
            vertical: false
            grid_options:
              columns: 6
            color: cyan
          - type: tile
            entity: sensor.telemetry_arduino_lvc_elapsed
            name: LVC elapsed
            icon: mdi:battery-alert-variant-outline
            vertical: false
            grid_options:
              columns: 6
            color: red
          - type: tile
            entity: sensor.telemetry_arduino_button_test_remaining
            name: Button test left
            icon: mdi:gesture-tap-button
            vertical: false
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: Controller state
            icon: mdi:chip
          - type: tile
            entity: sensor.telemetry_arduino_mode
            name: Mode
            icon: mdi:state-machine
            vertical: false
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_arduino_night
            name: Night
            icon: mdi:weather-night
            vertical: false
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_arduino_light_sense
            name: Light sense
            icon: mdi:theme-light-dark
            vertical: false
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_arduino_battery_band
            name: Battery band
            icon: mdi:battery-heart-variant
            vertical: false
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_arduino_output_cause
            name: Output cause
            icon: mdi:lightbulb-auto-outline
            vertical: false
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_arduino_transition_confirmation
            name: Transition confirm
            icon: mdi:timer-sand
            vertical: false
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_arduino_scheduler_time
            name: Scheduler time
            icon: mdi:timer-outline
            vertical: false
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_arduino_ldr
            name: LDR
            icon: mdi:brightness-6
            vertical: false
            grid_options:
              columns: 6
            color: amber
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Last 24 hours
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Light on / off
            hours_to_show: 24
            refresh_interval: 60
            grid_options:
              columns: full
            entities:
              - entity: binary_sensor.telemetry_arduino_lights_commanded
                name: Light
              - entity: sensor.telemetry_arduino_mode
                name: Mode
              - entity: sensor.telemetry_arduino_output_cause
                name: Reason
          - type: history-graph
            title: Battery and output
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.telemetry_battery_voltage
                name: Battery V
              - entity: sensor.telemetry_arduino_vdd
                name: Arduino VDD
              - entity: sensor.telemetry_arduino_light_duty
                name: Light duty %
            grid_options:
              columns: 12
          - type: history-graph
            title: Ambient light
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.telemetry_arduino_ldr
                name: LDR %
              - entity: sensor.telemetry_arduino_ldr_voltage
                name: LDR V
              - entity: sensor.telemetry_arduino_ldr_raw
                name: LDR raw
            grid_options:
              columns: 12
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: D1 receiver
            icon: mdi:wifi
          - type: tile
            entity: sensor.telemetry_d1_wifi_signal
            name: Wi-Fi signal
            icon: mdi:wifi
            vertical: false
            grid_options:
              columns: 6
            color: blue
          - type: tile
            entity: sensor.telemetry_d1_uptime
            name: Uptime
            icon: mdi:clock-outline
            vertical: false
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_d1_heap_free
            name: Free heap
            icon: mdi:memory
            vertical: false
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.telemetry_d1_heap_fragmentation
            name: Heap fragmentation
            icon: mdi:memory
            vertical: false
            grid_options:
              columns: 6
          - type: entities
            show_header_toggle: false
            grid_options:
              columns: 12
            entities:
              - entity: sensor.telemetry_d1_ip_address
                name: IP address
                icon: mdi:ip-network
              - entity: sensor.telemetry_d1_connected_ssid
                name: Connected SSID
                icon: mdi:wifi
              - entity: sensor.telemetry_d1_connected_bssid
                name: Connected access point (BSSID)
                icon: mdi:access-point
              - entity: sensor.telemetry_d1_reset_reason
                name: Last reset reason
                icon: mdi:restart-alert
              - entity: sensor.telemetry_d1_esphome_version
                name: ESPHome version
                icon: mdi:chip
              - entity: sensor.telemetry_d1_heap_largest_block
                name: Largest heap block
                icon: mdi:memory
          - type: markdown
            title: Latest Arduino diagnostic line
            content: '{{ states(''sensor.telemetry_arduino_diagnostic_line'') }}'
            grid_options:
              columns: 12
    dense_section_placement: true
