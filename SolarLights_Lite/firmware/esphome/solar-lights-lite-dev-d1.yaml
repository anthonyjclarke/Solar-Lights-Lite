# SolarLights Lite -- development-only, always-on Wemos D1 Mini telemetry.
#
# No additional telemetry modules are required. M2 D1/TX enters the EXISTING
# Q2/R8/R9/R10 NPN interface and reaches D6 as an inverted 9600-baud UART.
# This protects the 3.3 V ESP8266 from the Arduino's 3.3-4.2 V TX level.
# D5 and the former D8 status wire are not used: the parsed `output=` field is
# the light-status source. Do not connect a USB-UART adapter to the Arduino.
#
# This stays awake to receive every Arduino report. It is a test image, not the
# low-power production profile; use solar-lights-lite.yaml for that later work.
#
# The device is named `telemetry` so Home Assistant entity IDs are
# `*.telemetry_*`, matching solar-lights-lite-dev-dashboard.yaml. Renaming it
# changes every entity ID; update the dashboard to match.
#
# Required ESPHome secrets: wifi_ssid, wifi_password, esphome_encryption_key,
# ap_password.

substitutions:
  name: telemetry
  friendly: Telemetry

esphome:
  name: ${name}
  friendly_name: ${friendly}
  min_version: 2024.11.0

esp8266:
  board: d1_mini

logger:
  level: WARN

debug:
  update_interval: 30s     # required by the debug reset-reason and heap sensors

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 0s       # preserve UART capture when AP/HA is unavailable
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

api:
  encryption:
    key: !secret esphome_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

globals:
  - id: last_arduino_report_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

uart:
  id: arduino_diagnostics
  # ESP8266 software UART is sufficient at this low rate for the Arduino's
  # rate-limited diagnostics. Q2 inverts the signal, hence inverted: true.
  rx_pin:
    number: D6
    inverted: true
  baud_rate: 9600
  rx_buffer_size: 512
  debug:
    direction: RX
    dummy_receiver: true
    after:
      # Defaults (150 bytes / 100 ms) split the ~160-char Arduino line in two.
      bytes: 256
      timeout: 500ms
      delimiter: "\n"
    sequence:
      - lambda: |-
          std::string line(bytes.begin(), bytes.end());
          // Drop trailing CR/LF, then reject any line with corrupted bytes:
          // non-UTF-8 text makes HA drop the API connection (reconnect loop).
          while (!line.empty() && (line.back() == '\n' || line.back() == '\r')) line.pop_back();
          if (line.empty()) return;
          for (unsigned char c : line) {
            if (c < 0x20 || c > 0x7E) {
              ESP_LOGW("arduino", "Dropped corrupted UART line (%u bytes)", (unsigned) line.size());
              return;
            }
          }
          id(arduino_diagnostic_line).publish_state(line.c_str());

          auto number_of = [&](const char *key, float *result) -> bool {
            const std::string needle = std::string(key) + "=";
            const size_t position = line.find(needle);
            if (position == std::string::npos) return false;
            const char *start = line.c_str() + position + needle.size();
            char *end = nullptr;
            const float value = strtof(start, &end);
            if (end == start) return false;
            *result = value;
            return true;
          };
          auto word_of = [&](const char *key) -> std::string {
            const std::string needle = std::string(key) + "=";
            const size_t position = line.find(needle);
            if (position == std::string::npos) return "";
            const size_t start = position + needle.size();
            const size_t end = line.find_first_of(" \r\n", start);
            return line.substr(start, end - start);
          };

          float value = 0.0f;
          if (number_of("time", &value)) {
            id(arduino_scheduler_time_s).publish_state(value);
            id(last_arduino_report_ms) = millis();
          }
          if (number_of("vdd", &value)) id(arduino_vdd).publish_state(value);
          if (number_of("ldr", &value)) id(arduino_ldr_percent).publish_state(value);
          if (number_of("raw", &value)) id(arduino_ldr_raw).publish_state(value);
          if (number_of("ldr_v", &value)) id(arduino_ldr_voltage).publish_state(value);
          if (number_of("output", &value)) id(arduino_light_duty).publish_state(value);
          if (number_of("lvc", &value)) id(arduino_lvc_elapsed_s).publish_state(value);
          if (number_of("button", &value)) id(arduino_button_remaining_s).publish_state(value);

          const std::string battery = word_of("battery");
          const std::string sense = word_of("sense");
          const std::string mode = word_of("mode");
          const std::string night = word_of("night");
          const std::string cause = word_of("cause");
          const std::string confirm = word_of("confirm");
          if (!battery.empty()) id(arduino_battery_band).publish_state(battery.c_str());
          if (!sense.empty()) id(arduino_light_sense).publish_state(sense.c_str());
          if (!mode.empty()) id(arduino_mode).publish_state(mode.c_str());
          if (!night.empty()) id(arduino_night).publish_state(night.c_str());
          if (!cause.empty()) id(arduino_output_cause).publish_state(cause.c_str());
          if (!confirm.empty()) id(arduino_transition_confirmation).publish_state(confirm.c_str());

text_sensor:
  - platform: template
    id: arduino_diagnostic_line
    name: "Arduino Diagnostic Line"
    entity_category: diagnostic
  - platform: template
    id: arduino_battery_band
    name: "Arduino Battery Band"
    entity_category: diagnostic
  - platform: template
    id: arduino_light_sense
    name: "Arduino Light Sense"
    entity_category: diagnostic
  - platform: template
    id: arduino_mode
    name: "Arduino Mode"
    entity_category: diagnostic
  - platform: template
    id: arduino_night
    name: "Arduino Night"
    entity_category: diagnostic
  - platform: template
    id: arduino_output_cause
    name: "Arduino Output Cause"
    entity_category: diagnostic
  - platform: template
    id: arduino_transition_confirmation
    name: "Arduino Transition Confirmation"
    entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "D1 Reset Reason"
      entity_category: diagnostic
  - platform: version
    name: "D1 ESPHome Version"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "D1 IP Address"
      entity_category: diagnostic
    ssid:
      name: "D1 Connected SSID"
      entity_category: diagnostic
    bssid:
      name: "D1 Connected BSSID"
      entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "D1 Status"
    device_class: connectivity
    entity_category: diagnostic
  - platform: template
    name: "Arduino Diagnostics Fresh"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_arduino_report_ms) != 0 &&
             (uint32_t) (millis() - id(last_arduino_report_ms)) < 90000U;
  - platform: template
    name: "Arduino Lights Commanded"
    device_class: light
    lambda: |-
      return !isnan(id(arduino_light_duty).state) && id(arduino_light_duty).state > 0.0f;

sensor:
  # Existing battery divider: VBAT -> 220k external R5 -> D1 A0, with the
  # clone's onboard 220k/100k A0 divider. Recalibrate 5.21 against a meter.
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    pin: A0
    update_interval: 10s
    samples: 16
    accuracy_decimals: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 5.21
  - platform: copy
    source_id: battery_voltage
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          const float v[] = {3.30, 3.50, 3.60, 3.70, 3.80, 3.90, 4.00, 4.10, 4.20};
          const float p[] = {   0,    5,   15,   40,   60,   75,   85,   95,  100};
          if (x <= v[0]) return 0.0f;
          for (int i = 1; i < 9; i++)
            if (x <= v[i]) return p[i-1] + (x - v[i-1]) * (p[i] - p[i-1]) / (v[i] - v[i-1]);
          return 100.0f;

  - platform: template
    id: arduino_scheduler_time_s
    name: "Arduino Scheduler Time"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: arduino_vdd
    name: "Arduino VDD"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
  - platform: template
    id: arduino_ldr_percent
    name: "Arduino LDR"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: arduino_ldr_raw
    name: "Arduino LDR Raw"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: arduino_ldr_voltage
    name: "Arduino LDR Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
  - platform: template
    id: arduino_light_duty
    name: "Arduino Light Duty"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    id: arduino_lvc_elapsed_s
    name: "Arduino LVC Elapsed"
    unit_of_measurement: "s"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: arduino_button_remaining_s
    name: "Arduino Button Test Remaining"
    unit_of_measurement: "s"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: wifi_signal
    name: "D1 WiFi Signal"
    update_interval: 30s
    entity_category: diagnostic
  - platform: uptime
    name: "D1 Uptime"
    type: seconds
    update_interval: 30s
    entity_category: diagnostic
  - platform: debug
    free:
      name: "D1 Heap Free"
      entity_category: diagnostic
    block:
      name: "D1 Heap Largest Block"
      entity_category: diagnostic
    fragmentation:
      name: "D1 Heap Fragmentation"
      entity_category: diagnostic
