esphome:
  name: esphome-web-643111
  friendly_name: SolarLightsPwr
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp8266:
  board: d1_mini

deep_sleep:
  run_duration: 10min
  sleep_duration: 3h
   # check battery every 3 hours

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret esphome_encryption_key
  
# Allow Over-The-Air updates
ota:
- platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Set up a wifi access point
  ap: {}

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

#dashboard_import:
#  package_import_url: github://esphome/example-configs/esphome-web/esp8266.yaml@main
#  import_full_config: true

# To have a "next url" for improv serial
web_server:

 # Example configuration entry
#i2c:
#    id: bus_a
#    sda: D2
#    scl: D1
#    scan: true

sensor:
# Check SHT30 Temp / Humidity
#  - platform: sht3xd
#    address: 0x45
#    temperature:
#      name: "Lights Temp"
#    humidity:
#      name: "Lights Humidity"
#    update_interval: 60s
    
# Check Battery Level
  - platform: adc
    name: "Battery Voltage"
    id: battery_voltage
    pin: A0
#    device_class: battery
    accuracy_decimals: 2
    update_interval: 60s
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"   
    icon: mdi:battery-medium
    force_update: True
    filters:
      - multiply: 5.21 #double cell 18650

  # Battery percentage calculation
  # Based on typical Li-ion/Li-Po discharge curve
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    state_class: "measurement"
    lambda: |-
      float voltage = id(battery_voltage).state;
      if (voltage >= 4.1) return 100.0;
      else if (voltage >= 3.9) return 90.0;
      else if (voltage >= 3.8) return 75.0;
      else if (voltage >= 3.7) return 50.0;
      else if (voltage >= 3.6) return 25.0;
      else if (voltage >= 3.4) return 10.0;
      else if (voltage >= 3.0) return 5.0;
      else return 0.0;
    update_interval: 30s
      
  # 220k Resitor from PWR to A0

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

    # Add uptime sensor to track wake cycles
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
    entity_category: "diagnostic"

# Add binary sensors for better automation triggers
binary_sensor:
  # Device status sensor
  - platform: status
    name: "Status"
    id: device_status

text_sensor:
  # Add ESPHome version for diagnostics
  - platform: version
    name: "ESPHome Version"
    entity_category: "diagnostic"
