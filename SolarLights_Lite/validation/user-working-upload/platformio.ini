; SolarLights Lite – Arduino Pro Mini 3.3 V 8 MHz
; Rev 0.4: requires physically configured 8 MHz hardware. See ../../docs/BUILD_GUIDE.md.
; This serial upload profile is only for a compatible bootloader.
; A converted internal-8-MHz/no-bootloader Pro Mini must be uploaded via ISP.
; Batteries, panel and other modules must be disconnected during programming.
[env:pro8]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
upload_speed = 57600
upload_port = /dev/cu.usbserial-210
monitor_speed = 38400   
